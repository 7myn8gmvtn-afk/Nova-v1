<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Nova — Assistente</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
.app{min-height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
header{padding:28px 4px 18px}h1{margin:0;font-size:32px}p{color:#a8a8b0}
.chat{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding-bottom:18px}
.msg{max-width:86%;padding:13px 16px;border-radius:18px;line-height:1.35}.nova{background:#1b1b20;align-self:flex-start}.user{background:#fff;color:#111;align-self:flex-end}
.panel{background:#17171b;border:1px solid #29292f;border-radius:22px;padding:12px;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;background:transparent;border:0;outline:0;color:#fff;resize:none;font:inherit;min-height:44px;max-height:130px;padding:10px}
button{border:0;border-radius:16px;background:#fff;color:#111;font-weight:700;padding:12px 15px;min-width:52px}
.small{font-size:12px;color:#777;text-align:center;margin:8px 0 12px}
</style>
</head>
<body>
<div class="app">
<header><h1>Nova</h1><p>Seu assistente pessoal</p></header>
<main class="chat" id="chat">
<div class="msg nova">Oi! Eu sou a Nova. Digite um comando para começar.</div>
</main>
<div class="panel">
<textarea id="input" rows="1" placeholder="Digite um comando..."></textarea>
<button id="send">Enviar</button>
</div>
<div class="small">As ações importantes pedirão sua confirmação.</div>
</div>
<script>
const input=document.getElementById('input'), chat=document.getElementById('chat'), send=document.getElementById('send');
function add(text,cls){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function run(){
 const t=input.value.trim(); if(!t)return;
 add(t,'user'); input.value='';
 const l=t.toLowerCase();
 let r='Entendi. Esse comando ainda está no modo de protótipo. Vamos conectar essa ação às funções reais da Nova.';
 if(l.includes('oi')||l.includes('olá')) r='Oi! 👋 Pode mandar o que você quer que eu faça.';
 else if(l.includes('biblioteca')) r='Certo. A Nova pode ser preparada para procurar dentro da sua biblioteca.';
 else if(l.includes('solo leveling')) r='Entendi: procurar Solo Leveling no seu app de manhwa. Essa será uma das ações que vamos implementar.';
 else if(l.includes('capítulo')) r='Entendi. Vou tratar isso como um comando para abrir um capítulo específico.';
 add(r,'nova');
}
send.onclick=run;
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();run()}});
</script>
</body>
</html>
